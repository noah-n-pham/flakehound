services:
  postgres:
    image: postgres:16-alpine
    container_name: ci-insights-postgres
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci_insights
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci -d ci_insights"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: ./backend
    container_name: ci-insights-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the compose network Postgres answers on its own port, not 5433.
      DATABASE_URL: postgresql+psycopg://ci:ci@postgres:5432/ci_insights
    ports:
      - "8000:8000"

volumes:
  pgdata:
