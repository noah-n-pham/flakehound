name: deploy

# Chained off ci rather than off the push, so a commit whose tests failed can
# never reach production and the deploy job spends no metered minutes waiting.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # One instance runs one container and migrates at container start, so two
  # deploys must never overlap. Queue them rather than cancel: two jobs racing to
  # move `latest` would leave the box adopting whichever push won, which is not
  # necessarily the newer commit.
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write   # mint the OIDC token AWS trusts; there are no stored AWS keys
  contents: read

env:
  AWS_REGION: us-east-1
  # The account id is a repository variable, not a literal: it is not a credential,
  # but this repository is public and publishing it only helps enumeration.
  ECR_REPOSITORY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/flakehound

jobs:
  # This workflow pushes an image and then waits. It does not deploy anything, and
  # it holds no credential that could: the instance is unreachable from here
  # (no inbound rule, and the deploy user is denied every SSM action), so the box
  # polls ECR itself and restarts onto a digest it has not seen (D-053). What CI
  # can still do is refuse to go green until the commit it built is the one
  # answering in production, which is what the last step is for.
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Resolve the commit being deployed
        id: commit
        run: |
          # Without this the missing variable surfaces as an unparseable role ARN.
          [ -n "${{ vars.AWS_ACCOUNT_ID }}" ] \
            || { echo "the AWS_ACCOUNT_ID repository variable is not set" >&2; exit 1; }
          echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/flakehound-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # The instance is arm64 and this runner is amd64, so the platform is stated
      # rather than inherited. Getting this wrong produces a container that dies on
      # exec format error, which says nothing about where it was built.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      # Two tags for two jobs. `latest` is what the box polls, and moving it is the
      # entire act of deploying. The sha tag is what makes a rollback possible: it
      # is the only record of which digest was which commit once `latest` has moved
      # on. GIT_SHA is the same value a third time, baked in so the running process
      # can be asked rather than inferred.
      - name: Build and push linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ steps.commit.outputs.sha }}
          tags: |
            ${{ env.ECR_REPOSITORY }}:${{ steps.commit.outputs.sha }}
            ${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A 200 from `/healthz` is not evidence of a deploy. The previous image
      # would answer it just as cheerfully. The version field is, because it comes
      # out of the image being waited for. The box polls every 60s and the
      # container takes another ~40s to migrate and bind, so most of this budget is
      # slack for a restart that goes badly.
      - name: Wait for the instance to adopt this commit
        run: |
          want='${{ steps.commit.outputs.sha }}'
          for _ in $(seq 1 60); do
            body=$(curl -sS --max-time 10 https://api.flakehound.com/healthz || true)
            got=$(printf '%s' "$body" | jq -r '.version // "none"' 2>/dev/null || echo none)
            echo "healthz version=${got} want=${want}"
            if [ "$got" = "$want" ]; then
              echo "production is serving ${want}"
              exit 0
            fi
            sleep 10
          done
          echo "the instance never adopted ${want}; it is still on ${got}" >&2
          echo "the image is pushed, so this is the box not restarting, not a bad build" >&2
          exit 1
