name: deploy

# Chained off ci rather than off the push, so a commit whose tests failed can
# never reach production and the deploy job spends no metered minutes waiting.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # The service runs one task and migrates at container start, so two deploys must
  # never overlap. Queue them rather than cancel: a cancelled deploy would leave
  # the service on a revision nobody chose.
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write   # mint the OIDC token AWS trusts; there are no stored AWS keys
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 753397111940.dkr.ecr.us-east-1.amazonaws.com/flakehound
  ECS_CLUSTER: flakehound
  ECS_SERVICE: flakehound
  TASK_FAMILY: flakehound-app

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Resolve the commit being deployed
        id: commit
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::753397111940:role/flakehound-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # The task definition declares ARM64 and this runner is amd64, so the
      # platform is stated rather than inherited. Getting this wrong produces a
      # deploy failure that says nothing about architecture.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build and push linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.ECR_REPOSITORY }}:${{ steps.commit.outputs.sha }}
            ${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin the revision to this commit's image rather than deploying :latest, so
      # rollback is "point the service at an older revision" and nothing else.
      - name: Register a task definition revision for this commit
        id: taskdef
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > current.json
          jq --arg image "${ECR_REPOSITORY}:${{ steps.commit.outputs.sha }}" '
            .containerDefinitions[0].image = $image
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
          ' current.json > next.json
          revision=$(aws ecs register-task-definition --cli-input-json file://next.json \
            --query 'taskDefinition.revision' --output text)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "registered ${TASK_FAMILY}:${revision}"

      - name: Deploy
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "${TASK_FAMILY}:${{ steps.taskdef.outputs.revision }}" \
            --query 'service.taskDefinition' --output text
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].[runningCount,desiredCount,taskDefinition]' --output text

      - name: Check the deployed service answers over the tunnel
        run: |
          for i in $(seq 1 20); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' https://api.flakehound.com/healthz || true)
            echo "healthz=$code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "the tunnel never came back up" >&2
          exit 1
